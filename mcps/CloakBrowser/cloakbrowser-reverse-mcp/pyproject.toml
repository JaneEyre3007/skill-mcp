[project]
name = "cloakbrowser-reverse-mcp"
version = "0.1.0"
description = "CloakBrowser reverse engineering MCP server"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "esprima>=4.0.1",
]

[project.scripts]
cloakbrowser-reverse-mcp = "cloakbrowser_reverse_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloakbrowser_reverse_mcp"]
