interface:
  display_name: "Web Protocol Recovery"
  short_description: "Normal-Chrome-first protocol recovery"
  default_prompt: "Use $web-protocol-recovery to start each fresh target with a normal Chrome baseline, use js-reverse-mcp for source and mutation evidence, invoke launch_browser to switch to CloakBrowser only after fingerprint or environment-verification evidence, then deliver a browser-free Python collector plus a local JS parameter-restoration helper only when needed."

policy:
  allow_implicit_invocation: true
