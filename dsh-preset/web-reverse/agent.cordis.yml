# The `web-reverse` agent preset: the full `standard` coding agent, plus the
# website-reverse toolchain — six reverse-engineering MCP servers bridged via
# `dsh-mcp-client`, and the reverse-engineering skill roots wired into
# `skill-filesystem`. Everything else is the shipped `standard` composition,
# unchanged.
#
# PORTABLE TEMPLATE: this copy is machine-independent. The placeholders
# {{REVERSE_ROOT}} and {{PYTHON_EXE}} are substituted by restore/restore.ps1
# when a new machine is configured. The local (original) preset at
# <dshHome>/.agent-presets/web-reverse/agent.cordis.yml was NOT modified.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage. The host
# composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a website reverse-engineering agent powered by the {{model}} model, running on DeepSeek Harness. Your working directory is {{cwd}}.

      你的专长是网站 / 小程序协议逆向：JS 逆向与 AST 去混淆、签名与加密参数定位还原、反爬对抗（浏览器指纹 / 验证码 / 风控）、CDP 调试与 Hook、网络协议还原、爬虫落地。

      你挂载了六个逆向 MCP 服务器，其工具以 mcp__<server>__<tool> 命名：
      - mcp__jsrev__*：Chrome DevTools + Patchright 反检测的 JS 逆向、调试、Hook、断点分析
      - mcp__camoufox__*：Camoufox 反指纹浏览器上的 JS 分析、断点、网络拦截、JSVMP 字节码追踪
      - mcp__cloakbrowser__*：CloakBrowser 反检测 Chrome 的 JS 逆向与 Hook
      - mcp__devtools__*：官方 Chrome DevTools MCP（页面检查、性能分析、调试）
      - mcp__frx__*：Firefox Reverse 浏览器导演（agent 编排 / Marionette 控制 / 会话 workspace）
      - mcp__miniapp__*：微信小程序 CDP 逆向（请求监控、代码定位）

      工作方式：接到逆向任务后，先用 skill 工具按需加载逆向 skills（如 web-reverse-intel、js-resolve、ast-deobfuscate、iv8-web-reverse、web-protocol-recovery、browser-hook-snippets、camoufox-js-reverse、wechat-miniapp-reverse、ai-browser-reverse、find-crypto-entry），再调用对应的 mcp__* 工具实际执行（打开页面 / 下断点 / 抓包 / Hook / 还原算法 / 验证签名），最终把结果落地为可运行的还原代码或爬虫脚本，并附验证证据。优先动手验证，而不是纸上分析。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# `customSkillDirs` points at THIS repository's skills/ directory (14 skills),
# so skills live with the backup, update via `git pull`, and need no copy.
# {{REVERSE_ROOT}} is substituted by restore.ps1.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - '{{REVERSE_ROOT}}\skills'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── reverse-engineering MCP servers ─────────────────────────────────────────
#
# Each row bridges one local MCP server via `dsh-mcp-client`; its tools appear
# to the model as `mcp__<serverName>__<rawName>`. All rows are consumers and
# sit loose without a realm. `failOnStartupError` stays default-false, so a
# server whose browser/device is not running degrades to "no tools" instead of
# failing the preset mount.
#
# PORTABLE: {{REVERSE_ROOT}}/{{PYTHON_EXE}} are substituted by restore.ps1.
# The .bat launchers below are the ORIGINAL ones copied into this repo; they
# resolve everything relative to their own location (%~dp0), so the layout
# inside mcps/ mirrors the original layout and they run unmodified.

# chrome-devtools: official Chrome DevTools MCP (npm-hosted).
- id: mcp-devtools
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: devtools
    transport: stdio
    command: npx
    args: ['-y', 'chrome-devtools-mcp@latest']

# camoufox: anti-fingerprint browser for JS analysis / breakpoints / JSVMP trace.
# The launcher derives CAMOUFOX_EXECUTABLE_PATH from runtime\Camoufox\camoufox.exe
# relative to the toolchain root; restore.ps1 fetches the official browser and
# extracts the Camoufox-reverse zip into exactly that layout.
- id: mcp-camoufox
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: camoufox
    transport: stdio
    command: cmd
    args: ['/c', '{{REVERSE_ROOT}}\mcps\camoufox-toolchain\scripts\launch-camoufox-reverse-mcp.bat']
    env:
      PYTHON_EXE: '{{PYTHON_EXE}}'

# cloakbrowser: CloakBrowser anti-detection Chrome JS reverse / hooking.
# The launcher locates chrome.exe by walking up from the MCP package
# (parents[3] = CloakBrowser root); restore.ps1 extracts the CloakBrowser zip
# so chrome.exe lands beside cloakbrowser-reverse-mcp\ exactly as original.
- id: mcp-cloakbrowser
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: cloakbrowser
    transport: stdio
    command: cmd
    args: ['/c', '{{REVERSE_ROOT}}\mcps\CloakBrowser\cloakbrowser-reverse-mcp\launch.bat']
    env:
      PYTHON_EXE: '{{PYTHON_EXE}}'

# js-reverse: Chrome DevTools + Patchright anti-detection JS reverse / hooking.
- id: mcp-jsrev
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: jsrev
    transport: stdio
    command: node
    args: ['build/src/index.js']
    cwd: '{{REVERSE_ROOT}}\mcps\js-reverse-mcp'

# firefox-reverse: director console over a Marionette-driven Firefox Reverse
# browser. The browser itself must be running on 127.0.0.1:2828 when used.
- id: mcp-frx
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: frx
    transport: stdio
    command: node
    args: ['dist/index.js']
    cwd: '{{REVERSE_ROOT}}\mcps\frx-director-mcp'

# WeChat miniapp CDP reverse (the newer 25-tool copy). Connects to the WMPF
# debugger on port 62000.
- id: mcp-miniapp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: miniapp
    transport: stdio
    command: '{{PYTHON_EXE}}'
    args: ['run_mcp_server.py']
    cwd: '{{REVERSE_ROOT}}\mcps\miniapp-reverse-mcp'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
